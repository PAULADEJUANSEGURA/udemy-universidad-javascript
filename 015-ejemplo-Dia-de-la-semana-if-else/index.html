<!DOCTYPE html>
<html lang="es-es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Días de la semana</title>
</head>

<body>
    <h1>Selecciona los días</h1>

    <form id="formDias">

        <label><input type="radio" name="dia" value="lunes"> Lunes</label>
        <label><input type="radio" name="dia" value="martes"> Martes</label>
        <label><input type="radio" name="dia" value="miércoles"> Miércoles</label>
        <label><input type="radio" name="dia" value="jueves"> Jueves</label>
        <label><input type="radio" name="dia" value="viernes"> Viernes</label>
        <label><input type="radio" name="dia" value="sábado"> Sábado</label>
        <label><input type="radio" name="dia" value="domingo"> Domingo</label>

        <button type="submit">Comprobar</button>
    </form>
    <div>
        <h2 id="resultadoNumeroDia"></h2>
        <h2 id="resultado"></h2>
        <h2 id="descripcion"></h2>
    </div>

    <script src="ejemplo-dia-de-la-semana.js"></script>
    <!--<script src="ejemplo-con-if-else.js"></script>-->
</body>

</html>
